<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Moto Pit Master Owner & Staff Portal</title>
  <meta name="description" content="Secure authentication portal for Moto Pitshop business management, counter sales POS, inventory, and customer accounts." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%23F59E0B'><path d='M19 9c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H4C2.9 3 2 3.9 2 5v8c0 1.1.9 2 2 2h1c0 1.66 1.34 3 3 3s3-1.34 3-3h4c0 1.66 1.34 3 3 3s3-1.34 3-3h1c.55 0 1-.45 1-1v-3l-3-3h-1zM8 17c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm8 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z'/></svg>" />
  <style>
    :root {
      --bg-primary: #111318;
      --bg-sidebar: #17191F;
      --bg-card: #202329;
      --bg-card-hover: #262a32;
      --accent-orange: #F59E0B;
      --accent-orange-hover: #d97706;
      --accent-orange-dim: rgba(245, 158, 11, 0.12);
      --text-primary: #FFFFFF;
      --text-secondary: #A1A1AA;
      --text-muted: #71717A;
      --border: rgba(255, 255, 255, 0.08);
      --border-focus: rgba(245, 158, 11, 0.5);
      --success: #10B981;
      --danger: #EF4444;
      --radius-sm: 6px;
      --radius-md: 10px;
      --radius-lg: 14px;
      --font-main: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-heading: 'Rajdhani', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--font-main);
      background-color: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      background-image: 
        radial-gradient(circle at 15% 20%, rgba(245, 158, 11, 0.07) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(245, 158, 11, 0.05) 0%, transparent 45%);
    }

    .login-container {
      width: 100%;
      max-width: 480px;
    }

    .brand-header {
      text-align: center;
      margin-bottom: 28px;
    }

    .brand-logo {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-heading);
      font-size: 2rem;
      font-weight: 700;
      letter-spacing: 1px;
      color: #fff;
      text-decoration: none;
    }

    .brand-logo svg {
      width: 34px;
      height: 34px;
      fill: var(--accent-orange);
    }

    .brand-logo span {
      color: var(--accent-orange);
    }

    .brand-subtitle {
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--text-muted);
      text-transform: uppercase;
      margin-top: 6px;
    }

    .login-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 36px 32px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.45);
      position: relative;
      overflow: hidden;
    }

    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-orange), transparent);
    }

    .card-title {
      font-family: var(--font-heading);
      font-size: 1.4rem;
      font-weight: 700;
      margin-bottom: 6px;
      letter-spacing: 0.5px;
    }

    .card-subtitle {
      font-size: 0.88rem;
      color: var(--text-secondary);
      margin-bottom: 24px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-label {
      display: block;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      letter-spacing: 0.3px;
    }

    .form-input-wrap {
      position: relative;
    }

    .form-input {
      width: 100%;
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 12px 14px;
      color: #fff;
      font-family: var(--font-main);
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      outline: none;
      border-color: var(--accent-orange);
      box-shadow: 0 0 0 3px var(--accent-orange-dim);
    }

    .btn-submit {
      width: 100%;
      background: var(--accent-orange);
      color: #111318;
      border: none;
      border-radius: var(--radius-sm);
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 24px;
    }

    .btn-submit:hover {
      background: var(--accent-orange-hover);
      transform: translateY(-1px);
    }

    .btn-submit:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Demo Quick Credentials */
    .demo-section {
      margin-top: 28px;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    .demo-title {
      font-size: 0.76rem;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .demo-btn {
      background: var(--bg-sidebar);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      text-align: left;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .demo-btn:hover {
      background: var(--bg-card-hover);
      border-color: var(--accent-orange);
    }

    .demo-btn .role-tag {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--accent-orange);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .demo-btn .role-desc {
      font-size: 0.72rem;
      color: var(--text-muted);
    }

    .toast {
      position: fixed;
      bottom: 24px;
      right: 24px;
      background: var(--bg-card);
      border: 1px solid var(--border);
      padding: 12px 20px;
      border-radius: var(--radius-sm);
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
      transform: translateY(100px);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
      z-index: 9999;
    }

    .toast.show {
      transform: translateY(0);
      opacity: 1;
    }

    .toast.error { border-left: 4px solid var(--danger); }
    .toast.success { border-left: 4px solid var(--success); }

    .portal-links {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 18px;
      font-size: 0.85rem;
    }

    .portal-links a {
      color: var(--text-secondary);
      text-decoration: none;
      transition: color 0.2s;
    }

    .portal-links a:hover {
      color: var(--accent-orange);
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 2px solid rgba(17, 19, 24, 0.3);
      border-top-color: #111318;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="brand-header">
      <a href="/" class="brand-logo">
        <svg viewBox="0 0 24 24"><path d="M19 9c0-1.1-.9-2-2-2h-1V5c0-1.1-.9-2-2-2H4C2.9 3 2 3.9 2 5v8c0 1.1.9 2 2 2h1c0 1.66 1.34 3 3 3s3-1.34 3-3h4c0 1.66 1.34 3 3 3s3-1.34 3-3h1c.55 0 1-.45 1-1v-3l-3-3h-1zM8 17c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm8 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1z"/></svg>
        MOTO<span>PIT</span>
      </a>
      <div class="brand-subtitle">Business Management & Storefront Access</div>
    </div>

    <div class="login-card">
      <h1 class="card-title">Portal Sign In</h1>
      <p class="card-subtitle">Authenticate to access the Master Owner Panel, POS, or Customer Account.</p>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <div class="form-input-wrap">
            <input type="email" id="login-email" class="form-input" placeholder="name@motopitshop.com" required autocomplete="username" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <div class="form-input-wrap">
            <input type="password" id="login-password" class="form-input" placeholder="••••••••••••" required autocomplete="current-password" />
          </div>
        </div>

        <button type="submit" id="btn-submit" class="btn-submit">
          <span class="spinner" id="btn-spinner"></span>
          <span id="btn-text">Authenticate & Launch →</span>
        </button>

        <div class="portal-links">
          <a href="/">← Return to Storefront</a>
          <a href="/products">Browse Gear</a>
        </div>
      </form>

      <!-- Quick Role Fill Demo Buttons -->
      <div class="demo-section">
        <div class="demo-title">
          <span>⚡ One-Click Role Credentials</span>
        </div>
        <div class="demo-grid">
          <button type="button" class="demo-btn" onclick="fillRole('owner@motopitshop.com', 'MotoPit@2026!Owner', 'Owner')">
            <span class="role-tag">👑 Balaji (Owner)</span>
            <span class="role-desc">Full ERP & Owner Access</span>
          </button>
          <button type="button" class="demo-btn" onclick="fillRole('admin@motopitshop.com', 'MotoPit@2026!Admin', 'Manager')">
            <span class="role-tag">💼 Store Manager</span>
            <span class="role-desc">Operations & Reports</span>
          </button>
          <button type="button" class="demo-btn" onclick="fillRole('cashier@motopitshop.com', 'MotoPit@2026!Cashier', 'Cashier')">
            <span class="role-tag">💳 Counter Cashier</span>
            <span class="role-desc">Fast POS Billing & Receipts</span>
          </button>
          <button type="button" class="demo-btn" onclick="fillRole('inventory@motopitshop.com', 'MotoPit@2026!Inventory', 'Inventory')">
            <span class="role-tag">📦 Warehouse Staff</span>
            <span class="role-desc">Stock & Purchase Entry</span>
          </button>
          <button type="button" class="demo-btn" style="grid-column: span 2;" onclick="fillRole('customer@motopitshop.com', 'MotoPit@2026!Customer', 'Customer')">
            <span class="role-tag">🏍️ Demo Customer</span>
            <span class="role-desc">customer@motopitshop.com • Storefront Orders</span>
          </button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <script>
    const form = document.getElementById('login-form');
    const emailInput = document.getElementById('login-email');
    const passInput = document.getElementById('login-password');
    const submitBtn = document.getElementById('btn-submit');
    const btnSpinner = document.getElementById('btn-spinner');
    const btnText = document.getElementById('btn-text');
    const toast = document.getElementById('toast');

    function showToast(message, type = 'info') {
      toast.className = `toast ${type} show`;
      toast.textContent = message;
      setTimeout(() => {
        toast.className = 'toast';
      }, 4000);
    }

    function fillRole(email, password, label) {
      emailInput.value = email;
      passInput.value = password;
      showToast(`Filled credentials for ${label}. Click Authenticate.`, 'info');
    }

    // Check URL parameters for notices
    const urlParams = new URLSearchParams(window.location.search);
    const msg = urlParams.get('msg');
    const redirectParam = urlParams.get('redirect');

    if (msg === 'login_required') {
      showToast('Please sign in with your staff account to open the Owner Portal.', 'error');
    } else if (msg === 'staff_required') {
      showToast('Access restricted to authorized staff and owners.', 'error');
    } else if (msg === 'unauthorized') {
      showToast('Please sign in to access your customer dashboard.', 'error');
    }

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = emailInput.value.trim();
      const password = passInput.value;

      if (!email || !password) return;

      submitBtn.disabled = true;
      btnSpinner.style.display = 'inline-block';
      btnText.textContent = 'Verifying credentials...';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();

        if (!res.ok) {
          throw new Error(data.error || 'Authentication failed');
        }

        showToast(`Welcome back, ${data.user.full_name}! Redirecting...`, 'success');
        
        let destination = data.redirectUrl || '/';
        if (redirectParam) {
          destination = redirectParam;
        }

        setTimeout(() => {
          window.location.href = destination;
        }, 600);

      } catch (err) {
        showToast(err.message, 'error');
        submitBtn.disabled = false;
        btnSpinner.style.display = 'none';
        btnText.textContent = 'Authenticate & Launch →';
      }
    });
  </script>
</body>
</html>
